name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'deploy/**'
      - 'py_sod_metrics/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.7.0). Leave empty to build the selected ref.'
        type: string

permissions:
  contents: read

concurrency:
  group: docs-pages
  queue: max

jobs:
  build:
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[docs]'

      - name: Build documentation
        run: python -m sphinx -b html -d "$RUNNER_TEMP/sphinx-doctrees" deploy deploy/_build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
